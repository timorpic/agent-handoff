name: Template CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  template-checks:
    name: template-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|docs|refactor|test|ci|build|chore|perf|style)(\([a-zA-Z0-9][a-zA-Z0-9._/-]*\))?!?: [^[:space:]].*$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo '::error::PR 标题须使用 type(scope): 描述，scope 可省略，不兼容变更加 !。'
            exit 1
          fi
      - name: Check documentation
        run: sh scripts/check-docs.sh
      - name: Check template initialization
        run: node scripts/init.test.mjs
      - name: Check handoff helper
        run: node --test scripts/handoff.test.mjs
      - name: Check shell initialization
        run: bash scripts/bootstrap.test.sh
